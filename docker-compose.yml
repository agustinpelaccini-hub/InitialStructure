version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/appdb
      - JWT_SECRET=cambiame-en-produccion
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: ["npm","run","dev","--","--host","0.0.0.0"]
    depends_on:
      - backend
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    restart: unless-stopped

#  frontend-prod:
#    build:
#      context: ./frontend
#      dockerfile: Dockerfile.prod
#    ports:
#      - "80:80"
#    depends_on:
#      - backend
#    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped

# network is optional; default network will be used
volumes:
  db_data:
    driver: local
